<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .code-font { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .ui-font { font-family: 'IBM Plex Sans', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="#0d1117"/>

  <!-- Top App Bar -->
  <rect width="1200" height="50" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="25" r="6" fill="#27c93f"/>

  <!-- Brand Title & Session Info -->
  <text x="95" y="31" class="ui-font" font-size="14" font-weight="700" fill="#f0f6fc">CodeInterview</text>
  <rect x="200" y="14" width="130" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="210" y="29" class="code-font" font-size="11" fill="#58a6ff">SESSION #4829</text>
  <rect x="340" y="14" width="180" height="22" rx="4" fill="#1f242c" stroke="#238636" stroke-width="1"/>
  <circle cx="352" cy="25" r="4" fill="#3fb950"/>
  <text x="364" y="29" class="code-font" font-size="11" fill="#3fb950">DOCKER SANDBOX: ACTIVE</text>

  <!-- Top Right Session Controls -->
  <rect x="1060" y="12" width="115" height="26" rx="4" fill="#238636"/>
  <text x="1117" y="29" text-anchor="middle" class="ui-font" font-size="12" font-weight="600" fill="#ffffff">Finish Session</text>
  <text x="1000" y="30" class="code-font" font-size="12" fill="#8b949e">42:15</text>

  <!-- Left Sidebar: Problem Description (Width: 320) -->
  <rect x="0" y="50" width="340" height="625" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="15" y="65" width="80" height="20" rx="3" fill="#1f242c" stroke="#388bfd" stroke-width="1"/>
  <text x="55" y="79" text-anchor="middle" class="code-font" font-size="10" font-weight="600" fill="#58a6ff">MEDIUM</text>
  <text x="15" y="115" class="ui-font" font-size="18" font-weight="700" fill="#f0f6fc">Optimal Task Scheduling</text>
  
  <text x="15" y="145" class="ui-font" font-size="12" fill="#8b949e">Given a list of tasks with priorities and dependencies,</text>
  <text x="15" y="165" class="ui-font" font-size="12" fill="#8b949e">calculate the minimum time required to complete all</text>
  <text x="15" y="185" class="ui-font" font-size="12" fill="#8b949e">tasks on N worker nodes without race conditions.</text>

  <!-- Example Box -->
  <rect x="15" y="210" width="310" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="25" y="230" class="code-font" font-size="11" font-weight="600" fill="#79c0ff">Example 1:</text>
  <text x="25" y="250" class="code-font" font-size="11" fill="#8b949e">Input: tasks = [3, 2, 5, 1], workers = 2</text>
  <text x="25" y="270" class="code-font" font-size="11" fill="#8b949e">Output: 6</text>
  <text x="25" y="295" class="code-font" font-size="11" fill="#3fb950">Optimal distribution: [3, 2, 1] &amp; [5]</text>

  <!-- Constraints -->
  <text x="15" y="345" class="ui-font" font-size="12" font-weight="700" fill="#f0f6fc">Constraints:</text>
  <text x="15" y="365" class="code-font" font-size="11" fill="#8b949e">&#x2022; 1 &lt;= tasks.length &lt;= 10^5</text>
  <text x="15" y="385" class="code-font" font-size="11" fill="#8b949e">&#x2022; Sandboxed CPU: 1 Core / 256MB RAM</text>
  <text x="15" y="405" class="code-font" font-size="11" fill="#8b949e">&#x2022; Network: Disabled (--net=none)</text>

  <!-- Main Center Code Editor Pane (x: 340, width: 860) -->
  <rect x="340" y="50" width="860" height="425" fill="#0d1117"/>
  
  <!-- Editor Tabs Bar -->
  <rect x="340" y="50" width="860" height="35" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="340" y="50" width="140" height="35" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="360" y="72" class="code-font" font-size="12" fill="#f0f6fc">solution.py</text>
  <circle cx="460" cy="68" r="4" fill="#3fb950"/>

  <!-- Line Numbers & Code -->
  <g class="code-font" font-size="13">
    <!-- Line numbers column -->
    <text x="360" y="115" fill="#484f58">01</text>
    <text x="360" y="140" fill="#484f58">02</text>
    <text x="360" y="165" fill="#484f58">03</text>
    <text x="360" y="190" fill="#484f58">04</text>
    <text x="360" y="215" fill="#484f58">05</text>
    <text x="360" y="240" fill="#484f58">06</text>
    <text x="360" y="265" fill="#484f58">07</text>
    <text x="360" y="290" fill="#484f58">08</text>
    <text x="360" y="315" fill="#484f58">09</text>
    <text x="360" y="340" fill="#484f58">10</text>
    <text x="360" y="365" fill="#484f58">11</text>
    <text x="360" y="390" fill="#484f58">12</text>
    <text x="360" y="415" fill="#484f58">13</text>

    <!-- Code tokens -->
    <text x="400" y="115"><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> heapq</tspan></text>
    <text x="400" y="140"><tspan fill="#ff7b72">from</tspan><tspan fill="#c9d1d9"> typing </tspan><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> List</tspan></text>
    <text x="400" y="165"><tspan fill="#ff7b72">def</tspan><tspan fill="#d2a8ff"> min_completion_time</tspan><tspan fill="#c9d1d9">(tasks: List[</tspan><tspan fill="#79c0ff">int</tspan><tspan fill="#c9d1d9">], workers: </tspan><tspan fill="#79c0ff">int</tspan><tspan fill="#c9d1d9">) -&gt; </tspan><tspan fill="#79c0ff">int</tspan><tspan fill="#c9d1d9">:</tspan></text>
    <text x="420" y="190"><tspan fill="#8b949e"># Use min-heap to distribute jobs across workers dynamically</tspan></text>
    <text x="420" y="215"><tspan fill="#c9d1d9">worker_pool = [</tspan><tspan fill="#79c0ff">0</tspan><tspan fill="#c9d1d9">] * workers</tspan></text>
    <text x="420" y="240"><tspan fill="#c9d1d9">heapq.heapify(worker_pool)</tspan></text>
    <text x="420" y="265"><tspan fill="#c9d1d9">sorted_tasks = sorted(tasks, reverse=</tspan><tspan fill="#79c0ff">True</tspan><tspan fill="#c9d1d9">)</tspan></text>
    <text x="420" y="290"><tspan fill="#ff7b72">for</tspan><tspan fill="#c9d1d9"> duration </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#c9d1d9"> sorted_tasks:</tspan></text>
    <text x="440" y="315"><tspan fill="#c9d1d9">current_least = heapq.heappop(worker_pool)</tspan></text>
    <text x="440" y="340"><tspan fill="#c9d1d9">heapq.heappush(worker_pool, current_least + duration)</tspan></text>
    <text x="420" y="365"><tspan fill="#ff7b72">return</tspan><tspan fill="#79c0ff"> max</tspan><tspan fill="#c9d1d9">(worker_pool)</tspan></text>
    
    <!-- Remote Cursor Presence -->
    <rect x="635" y="352" width="2" height="17" fill="#58a6ff"/>
    <rect x="635" y="340" width="75" height="16" rx="2" fill="#1f6feb"/>
    <text x="638" y="352" class="ui-font" font-size="10" font-weight="600" fill="#ffffff">Candidate</text>
  </g>

  <!-- WebRTC Interviewer Video Call Overlay (Top Right: x: 960, y: 70) -->
  <rect x="940" y="65" width="240" height="150" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- Video Avatar Silhouette -->
  <circle cx="1060" cy="125" r="32" fill="#21262d"/>
  <path d="M 1020 180 C 1020 150, 1100 150, 1100 180" fill="#30363d"/>
  <circle cx="1060" cy="125" r="3" fill="#58a6ff"/>
  <!-- Audio Waveform Indicator -->
  <rect x="955" y="185" width="100" height="20" rx="3" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <circle cx="965" cy="195" r="3" fill="#3fb950"/>
  <text x="975" y="199" class="code-font" font-size="10" fill="#3fb950">Interviewer (Live)</text>

  <!-- Bottom Panel: Docker Execution & Test Output (y: 475, height: 200) -->
  <rect x="340" y="475" width="860" height="200" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal Header -->
  <rect x="340" y="475" width="860" height="35" fill="#21262d"/>
  <text x="360" y="497" class="code-font" font-size="12" font-weight="600" fill="#f0f6fc">SANDBOX TERMINAL // DOCKER RUNNER</text>
  
  <rect x="1080" y="480" width="105" height="26" rx="4" fill="#238636"/>
  <text x="1132" y="497" text-anchor="middle" class="ui-font" font-size="11" font-weight="600" fill="#ffffff">&#x25B6; Run Tests</text>

  <!-- Test Results -->
  <g class="code-font" font-size="12">
    <text x="360" y="535" fill="#3fb950">&#x2714; Test Case 1: [3, 2, 5, 1], workers=2 -&gt; Passed (Output: 6, Target: 6)</text>
    <text x="360" y="560" fill="#3fb950">&#x2714; Test Case 2: [10, 20, 30], workers=3 -&gt; Passed (Output: 30, Target: 30)</text>
    <text x="360" y="585" fill="#3fb950">&#x2714; Test Case 3: Large Array 100,000 tasks -&gt; Passed (Execution Time: 14.2ms)</text>
    <text x="360" y="615" fill="#58a6ff">RESULT: 3/3 Tests Passed | Memory: 18.4MB | Exit Code: 0 (Clean Execution)</text>
    <text x="360" y="640" fill="#8b949e">AI EVALUATOR: Code complexity O(N log K) verified optimal.</text>
  </g>
</svg>