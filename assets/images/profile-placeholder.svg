<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <pattern id="profile-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#171717" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="#0c0c0c"/>
  <rect width="500" height="500" fill="url(#profile-grid)"/>

  <!-- Technical Inner Boundary -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Industrial Viewfinder Reticles -->
  <path d="M 20 44 L 20 20 L 44 20" fill="none" stroke="#383838" stroke-width="2"/>
  <path d="M 456 20 L 480 20 L 480 44" fill="none" stroke="#383838" stroke-width="2"/>
  <path d="M 20 456 L 20 480 L 44 480" fill="none" stroke="#383838" stroke-width="2"/>
  <path d="M 456 480 L 480 480 L 480 456" fill="none" stroke="#383838" stroke-width="2"/>

  <!-- Corner Coordinates / Metadata -->
  <text x="36" y="42" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#4a4a4a">DEV_ID // PORTRAIT_FRAME</text>
  <text x="464" y="42" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#4a4a4a">1:1 / 500x500</text>

  <!-- Technical Focus Ring -->
  <circle cx="250" cy="210" r="90" fill="none" stroke="#1f1f1f" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Center Portrait Glyph (Stylized Engineer Avatar) -->
  <g stroke="#484848" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="250" cy="180" r="46"/>
    <!-- Shoulders -->
    <path d="M 170 290 C 170 240, 330 240, 330 290"/>
    <!-- Reticle crosshair dots -->
    <circle cx="250" cy="180" r="3" fill="#666666"/>
  </g>

  <!-- Text Hierarchy -->
  <text x="250" y="330" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#777777" letter-spacing="1">PROFILE PHOTO PLACEHOLDER</text>
  <text x="250" y="358" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="700" fill="#e5e5e5">Your Photo Here</text>
  <text x="250" y="385" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" fill="#555555" letter-spacing="0.5">DROP HEADSHOT // UPDATE SRC IN INDEX.HTML</text>

  <!-- Ratio Capsule -->
  <rect x="195" y="410" width="110" height="22" rx="2" fill="#141414" stroke="#242424" stroke-width="1"/>
  <text x="250" y="425" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#888888" letter-spacing="1">1:1 RATIO</text>

  <!-- Axis Markers -->
  <line x1="250" y1="24" x2="250" y2="34" stroke="#262626" stroke-width="1"/>
  <line x1="250" y1="466" x2="250" y2="476" stroke="#262626" stroke-width="1"/>
  <line x1="24" y1="250" x2="34" y2="250" stroke="#262626" stroke-width="1"/>
  <line x1="466" y1="250" x2="476" y2="250" stroke="#262626" stroke-width="1"/>
</svg>
