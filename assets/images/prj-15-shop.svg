<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .code-font { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .ui-font { font-family: 'IBM Plex Sans', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="#0c0c0c"/>

  <!-- Top Announcement Bar -->
  <rect width="1200" height="32" fill="#141414" stroke="#222222" stroke-width="1"/>
  <text x="600" y="21" text-anchor="middle" class="code-font" font-size="11" font-weight="600" fill="#a0a0a0">SPRING 2026 TECHNICAL DROPS &amp; EDC // COMPLIMENTARY EXPRESS SHIPPING OVER $150</text>

  <!-- Main Storefront Header (y: 32, height: 65) -->
  <rect y="32" width="1200" height="65" fill="#111111" stroke="#222222" stroke-width="1"/>
  
  <!-- Brand Logo -->
  <text x="40" y="73" class="ui-font" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">ATELIER // GEAR</text>
  
  <!-- Category Navigation Links -->
  <g class="ui-font" font-size="13" font-weight="600">
    <text x="260" y="71" fill="#ffffff">All Products</text>
    <line x1="260" y1="80" x2="340" y2="80" stroke="#ffffff" stroke-width="2"/>
    <text x="370" y="71" fill="#888888">Technical Outerwear</text>
    <text x="530" y="71" fill="#888888">Carry Gear &amp; Packs</text>
    <text x="690" y="71" fill="#888888">Field Tools</text>
  </g>

  <!-- Search & Cart CTA -->
  <rect x="850" y="48" width="180" height="34" rx="4" fill="#1a1a1a" stroke="#2c2c2c" stroke-width="1"/>
  <text x="865" y="70" class="ui-font" font-size="12" fill="#666666">Search apparel, gear...</text>

  <!-- Cart Button -->
  <rect x="1050" y="48" width="110" height="34" rx="4" fill="#ffffff"/>
  <text x="1090" y="70" class="ui-font" font-size="13" font-weight="700" fill="#000000">Bag (2)</text>
  <circle cx="1072" cy="65" r="5" fill="#000000"/>

  <!-- Left Main Catalog Grid (x: 40, width: 750) -->
  <!-- Section Title -->
  <text x="40" y="130" class="ui-font" font-size="16" font-weight="700" fill="#ffffff">CURATED ARCHIVE</text>
  <text x="40" y="148" class="code-font" font-size="11" fill="#777777">Showing 18 in-stock performance items</text>

  <!-- Product 1: Jacket -->
  <g transform="translate(40, 165)">
    <rect width="230" height="470" rx="4" fill="#141414" stroke="#222222" stroke-width="1"/>
    <!-- Image Box -->
    <rect x="10" y="10" width="210" height="260" rx="3" fill="#1a1a1a"/>
    <!-- Wireframe Jacket Shape -->
    <path d="M 65 60 L 115 40 L 165 60 L 195 100 L 175 140 L 155 120 L 155 240 L 75 240 L 75 120 L 55 140 L 35 100 Z" fill="#262626" stroke="#333333" stroke-width="1.5"/>
    <rect x="20" y="20" width="60" height="20" rx="2" fill="#222222"/>
    <text x="50" y="34" text-anchor="middle" class="code-font" font-size="9" font-weight="600" fill="#3fb950">WATERPROOF</text>
    
    <!-- Meta -->
    <text x="15" y="295" class="ui-font" font-size="14" font-weight="700" fill="#ffffff">Merino Storm Shell</text>
    <text x="15" y="315" class="ui-font" font-size="12" fill="#888888">3-Layer breathable GORE</text>
    <text x="15" y="345" class="code-font" font-size="15" font-weight="700" fill="#ffffff">$185.00</text>
    
    <!-- Add to cart button -->
    <rect x="15" y="415" width="200" height="34" rx="3" fill="#222222" stroke="#333333" stroke-width="1"/>
    <text x="115" y="437" text-anchor="middle" class="ui-font" font-size="12" font-weight="600" fill="#ffffff">Add To Bag</text>
  </g>

  <!-- Product 2: Sling Pack -->
  <g transform="translate(290, 165)">
    <rect width="230" height="470" rx="4" fill="#141414" stroke="#222222" stroke-width="1"/>
    <rect x="10" y="10" width="210" height="260" rx="3" fill="#1a1a1a"/>
    <!-- Wireframe Backpack Shape -->
    <rect x="65" y="60" width="100" height="160" rx="16" fill="#262626" stroke="#333333" stroke-width="1.5"/>
    <rect x="80" y="110" width="70" height="80" rx="8" fill="#303030"/>
    <rect x="20" y="20" width="65" height="20" rx="2" fill="#222222"/>
    <text x="52" y="34" text-anchor="middle" class="code-font" font-size="9" font-weight="600" fill="#58a6ff">CORDURA 500D</text>

    <text x="15" y="295" class="ui-font" font-size="14" font-weight="700" fill="#ffffff">Tactical Sling 8L</text>
    <text x="15" y="315" class="ui-font" font-size="12" fill="#888888">Weatherproof EDC carry</text>
    <text x="15" y="345" class="code-font" font-size="15" font-weight="700" fill="#ffffff">$95.00</text>

    <rect x="15" y="415" width="200" height="34" rx="3" fill="#222222" stroke="#333333" stroke-width="1"/>
    <text x="115" y="437" text-anchor="middle" class="ui-font" font-size="12" font-weight="600" fill="#ffffff">Add To Bag</text>
  </g>

  <!-- Product 3: Multi-Tool -->
  <g transform="translate(540, 165)">
    <rect width="230" height="470" rx="4" fill="#141414" stroke="#222222" stroke-width="1"/>
    <rect x="10" y="10" width="210" height="260" rx="3" fill="#1a1a1a"/>
    <!-- Wireframe Multi-Tool Shape -->
    <rect x="95" y="50" width="40" height="170" rx="6" fill="#262626" stroke="#333333" stroke-width="1.5"/>
    <rect x="105" y="70" width="20" height="80" rx="3" fill="#363636"/>
    <rect x="20" y="20" width="55" height="20" rx="2" fill="#222222"/>
    <text x="47" y="34" text-anchor="middle" class="code-font" font-size="9" font-weight="600" fill="#e5e5e5">GRADE 5 TI</text>

    <text x="15" y="295" class="ui-font" font-size="14" font-weight="700" fill="#ffffff">Titanium Pry Bar</text>
    <text x="15" y="315" class="ui-font" font-size="12" fill="#888888">CNC machined pocket tool</text>
    <text x="15" y="345" class="code-font" font-size="15" font-weight="700" fill="#ffffff">$54.00</text>

    <rect x="15" y="415" width="200" height="34" rx="3" fill="#222222" stroke="#333333" stroke-width="1"/>
    <text x="115" y="437" text-anchor="middle" class="ui-font" font-size="12" font-weight="600" fill="#ffffff">Add To Bag</text>
  </g>

  <!-- Right Slide-Out Cart Drawer (x: 810, width: 390) -->
  <rect x="800" y="97" width="400" height="578" fill="#121212" stroke="#262626" stroke-width="1.5"/>
  
  <!-- Drawer Header -->
  <text x="830" y="135" class="ui-font" font-size="18" font-weight="700" fill="#ffffff">Your Bag (2)</text>
  <text x="1160" y="135" text-anchor="end" class="ui-font" font-size="18" fill="#888888">&#x2715;</text>

  <!-- Free Shipping Progress Threshold -->
  <rect x="830" y="155" width="340" height="50" rx="4" fill="#181818" stroke="#262626" stroke-width="1"/>
  <text x="845" y="177" class="code-font" font-size="11" font-weight="600" fill="#3fb950">&#x2713; FREE EXPRESS SHIPPING UNLOCKED</text>
  <!-- Full bar -->
  <rect x="845" y="187" width="310" height="6" rx="3" fill="#222222"/>
  <rect x="845" y="187" width="310" height="6" rx="3" fill="#3fb950"/>

  <!-- Cart Item 1 -->
  <g transform="translate(830, 225)">
    <rect width="340" height="85" rx="4" fill="#161616" stroke="#262626" stroke-width="1"/>
    <rect x="10" y="10" width="65" height="65" rx="3" fill="#222222"/>
    <text x="90" y="32" class="ui-font" font-size="13" font-weight="700" fill="#ffffff">Merino Storm Shell</text>
    <text x="90" y="50" class="code-font" font-size="11" fill="#888888">Size: M | Color: Matte Black</text>
    <text x="90" y="68" class="code-font" font-size="13" font-weight="700" fill="#ffffff">$185.00</text>
    <text x="320" y="32" text-anchor="end" class="code-font" font-size="12" fill="#888888">Qty: 1</text>
  </g>

  <!-- Cart Item 2 -->
  <g transform="translate(830, 325)">
    <rect width="340" height="85" rx="4" fill="#161616" stroke="#262626" stroke-width="1"/>
    <rect x="10" y="10" width="65" height="65" rx="3" fill="#222222"/>
    <text x="90" y="32" class="ui-font" font-size="13" font-weight="700" fill="#ffffff">Tactical Sling 8L</text>
    <text x="90" y="50" class="code-font" font-size="11" fill="#888888">Color: Ranger Slate</text>
    <text x="90" y="68" class="code-font" font-size="13" font-weight="700" fill="#ffffff">$95.00</text>
    <text x="320" y="32" text-anchor="end" class="code-font" font-size="12" fill="#888888">Qty: 1</text>
  </g>

  <!-- Subtotal and Checkout Section -->
  <line x1="830" y1="440" x2="1170" y2="440" stroke="#262626" stroke-width="1"/>
  
  <text x="830" y="470" class="ui-font" font-size="13" fill="#888888">Subtotal</text>
  <text x="1170" y="470" text-anchor="end" class="code-font" font-size="14" font-weight="600" fill="#ffffff">$280.00</text>

  <text x="830" y="495" class="ui-font" font-size="13" fill="#888888">Express Shipping</text>
  <text x="1170" y="495" text-anchor="end" class="code-font" font-size="13" font-weight="600" fill="#3fb950">FREE</text>

  <text x="830" y="530" class="ui-font" font-size="16" font-weight="700" fill="#ffffff">Total</text>
  <text x="1170" y="530" text-anchor="end" class="code-font" font-size="18" font-weight="700" fill="#ffffff">$280.00</text>

  <!-- Checkout Button -->
  <rect x="830" y="560" width="340" height="46" rx="4" fill="#ffffff"/>
  <text x="1000" y="588" text-anchor="middle" class="ui-font" font-size="14" font-weight="700" fill="#000000">Proceed to Checkout &#x2192;</text>
</svg>